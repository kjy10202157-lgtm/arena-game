<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="모바일과 PC에서 즐기는 3대3 브라우저 아레나 게임">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEON CLASH">
  <title>NEON CLASH</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="3대3 아레나 게임 화면"></canvas>
    <header id="hud" aria-live="polite">
      <div class="team blue"><span>BLUE</span><strong id="blue-score">0</strong></div>
      <div class="match"><span id="timer">02:00</span><small>먼저 10점</small></div>
      <div class="team red"><strong id="red-score">0</strong><span>RED</span></div>
    </header>
    <section id="status"><div><span id="class-label">돌격형 · HP</span><strong id="hp-text">100</strong></div><div class="track"><i id="health-fill"></i></div><p id="skill-progress">스킬 LV.1 · 다음 강화까지 3킬</p><p id="respawn-text"></p></section>
    <button id="pause-button" type="button" aria-label="일시정지">Ⅱ</button>
    <button id="ability-button" type="button" aria-label="필살기 사용"><strong id="ability-key">⚡</strong><span id="ability-name">오버드라이브</span><i id="ability-cooldown"></i></button>
    <section id="mobile-controls" aria-label="모바일 조작">
      <div id="move-stick" class="stick"><div class="knob"></div><span>이동</span></div>
      <div id="aim-stick" class="stick aim"><div class="knob"></div><span>조준 · 공격</span></div>
    </section>
    <section id="start-screen" class="overlay visible"><div class="panel">
      <div class="eyebrow">3 VS 3 ARENA · V2</div><h1>NEON<br><em>CLASH</em></h1><p>전투 스타일을 선택하고 먼저 10점을 차지하세요.</p>
      <div id="class-select" aria-label="캐릭터 선택">
        <button class="class-card selected" data-class="assault" type="button"><b>⚡ 돌격형</b><small>빠른 이동과 연사<br>필살기: 오버드라이브</small></button>
        <button class="class-card" data-class="tank" type="button"><b>🛡️ 탱커형</b><small>높은 체력과 방어<br>필살기: 보호막</small></button>
        <button class="class-card" data-class="sniper" type="button"><b>🎯 저격형</b><small>느리지만 강한 공격<br>필살기: 관통탄</small></button>
      </div>
      <div class="best-record">⚡ 최단 승리 <strong id="best-time">기록 없음</strong></div>
      <div class="hint"><span class="desktop-hint">WASD 이동 · 마우스 조준/공격</span><span class="mobile-hint">왼쪽 이동 · 오른쪽 조준/공격</span></div>
      <button id="start-button" type="button">게임 시작</button>
    </div></section>
    <section id="pause-screen" class="overlay"><div class="panel compact"><div class="eyebrow">PAUSED</div><h2>잠시 멈춤</h2><button id="resume-button" type="button">계속하기</button><button id="restart-button" class="secondary" type="button">처음부터</button></div></section>
    <section id="result-screen" class="overlay"><div class="panel compact result-panel"><div class="eyebrow">MATCH OVER</div><h2 id="result-title">승리!</h2><p id="result-score"></p>
      <div class="result-stats" aria-label="경기 통계">
        <div><span>경기 시간</span><strong id="stat-time">0.0초</strong></div>
        <div><span>처치</span><strong id="stat-kills">0</strong></div>
        <div><span>사망</span><strong id="stat-deaths">0</strong></div>
        <div><span>발사</span><strong id="stat-shots">0</strong></div>
        <div><span>명중률</span><strong id="stat-accuracy">0%</strong></div>
        <div><span>가한 피해</span><strong id="stat-damage">0</strong></div>
      </div>
      <div id="result-best" class="result-best">⚡ 최단 승리 기록 없음</div><button id="play-again-button" type="button">역할 다시 선택</button></div></section>
  </main>
  <script src="game.js?v=9"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
