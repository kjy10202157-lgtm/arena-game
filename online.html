<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <title>NEON CLASH · ONLINE</title>
  <link rel="stylesheet" href="online.css?v=49">
</head>
<body>
  <main id="online-shell">
    <canvas id="online-game" aria-label="6인 온라인 3대3 아레나 게임"></canvas>
    <header id="online-hud"><strong class="blue">BLUE <span id="online-blue">0</span></strong><div><span id="online-timer">02:00</span><small id="network-state">연결 준비</small><small id="online-map-label">네온 공장</small></div><strong class="red"><span id="online-red">0</span> RED</strong></header>
    <aside id="online-player-status"><div><b id="online-role-label">돌격형 · HP</b><strong id="online-hp">100</strong></div><div class="online-health"><i id="online-health-fill"></i></div><small id="online-skill-level">스킬 LV.1</small></aside>
    <section id="online-lobby" class="online-overlay visible"><div class="online-panel">
      <div class="online-eyebrow">6 PLAYER ONLINE · ALPHA</div><h1>진짜 온라인 3대3</h1><p>실제 플레이어 6명이 모이면 BLUE 3명과 RED 3명으로 자동 배정되어 경기가 시작됩니다.</p>
      <div class="online-roles"><button class="selected" data-role="assault" type="button">⚡ 돌격형</button><button data-role="tank" type="button">🛡️ 탱커형</button><button data-role="sniper" type="button">🎯 저격형</button><button data-role="support" type="button">✚ 지원형</button></div>
      <button id="quick-match" type="button">⚡ 6인 3대3 빠른 대전 참가</button>
      <button id="cancel-match" class="cancel-match" type="button" hidden>매칭 취소</button>
      <div id="room-result" class="room-result">빠른 대전을 눌러 6인 대기열에 참가하세요.</div>
      <div id="six-roster" class="online-roster six" aria-label="6명 참가자 상태"></div>
      <a href="index.html">← 싱글플레이로 돌아가기</a>
      <small class="beta-note">Cloudflare 실시간 서버가 연결되어야 플레이할 수 있습니다.</small>
    </div></section>
    <section id="online-result" class="online-overlay"><div class="online-panel compact result-panel"><div class="online-eyebrow">MATCH OVER</div><h2 id="online-result-title">경기 종료</h2><p id="online-result-score"></p><div class="online-result-stats"><div><span>처치</span><strong id="online-stat-kills">0</strong></div><div><span>사망</span><strong id="online-stat-deaths">0</strong></div><div><span>발사</span><strong id="online-stat-shots">0</strong></div><div><span>명중률</span><strong id="online-stat-accuracy">0%</strong></div><div><span>피해량</span><strong id="online-stat-damage">0</strong></div><div><span>스킬</span><strong id="online-stat-skill">LV.1</strong></div><div><span>경험치</span><strong id="online-stat-xp">+0 XP</strong></div></div><button id="online-again" type="button">같은 방에서 재대결</button><a href="index.html">싱글플레이로 나가기</a></div></section>
    <button id="online-ability" type="button" disabled><strong>⚡</strong><span id="online-ability-name">오버드라이브</span><i id="online-ability-cooldown"></i></button>
    <button id="online-auxiliary" type="button" disabled><strong id="online-auxiliary-icon">➤</strong><span id="online-auxiliary-name">전술 돌진</span><i id="online-auxiliary-cooldown"></i></button>
    <button id="online-ping" type="button"><strong>📡</strong><span>팀 지시</span></button>
    <section id="online-ping-menu" aria-label="온라인 팀 지시 선택"><button data-ping="attack" type="button">⚔ 공격</button><button data-ping="regroup" type="button">◎ 집결</button><button data-ping="heal" type="button">✚ 지원</button><button data-ping="retreat" type="button">◀ 후퇴</button></section>
    <div id="online-ping-toast" role="status" aria-live="polite"></div>
    <aside id="online-kill-feed" aria-label="온라인 킬피드" aria-live="polite"></aside>
    <div id="online-combat-alert" role="status" aria-live="assertive"></div>
    <section id="online-controls" aria-label="모바일 조작"><div id="online-move" class="online-stick"><i></i><span>이동</span></div><div id="online-aim" class="online-stick aim"><i></i><span>조준 · 공격</span></div></section>
  </main>
  <script src="online-config.js?v=49"></script>
  <script src="arena-obstacles.js?v=50"></script>
<script src="online6.js?v=50"></script>
</body>
</html>
